<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Rida! 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #4a4a4a;
      overflow-x: hidden;
    }
    .container {
      width: 90%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(238, 156, 167, 0.4);
      text-align: center;
      position: relative;
      z-index: 2;
    }
    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem;
      color: #d63384;
      margin-bottom: 10px;
    }
    p { margin-bottom: 15px; font-size: 0.95rem; }
    .screen { display: none; }
    .active { display: block; }
    
    /* Lock Screen Header Sticker */
    .sticker-container {
      font-size: 4rem;
      margin: 10px 0 15px 0;
      user-select: none;
      line-height: 1;
    }
    .pin-display {
      width: 100%;
      height: 45px;
      background: #fff;
      border: 2px solid #ffb6c1;
      border-radius: 10px;
      font-size: 1.5rem;
      letter-spacing: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      color: #d63384;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .keypad button {
      padding: 12px;
      font-size: 1.2rem;
      border: none;
      background: #ffb6c1;
      color: white;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    .keypad button:active { transform: scale(0.95); background: #d63384; }

    /* Dashboard */
    .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
    .card-btn {
      background: #fff;
      border: 2px solid #ffb6c1;
      border-radius: 12px;
      padding: 15px 5px;
      cursor: pointer;
      transition: 0.2s;
    }
    .card-btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    .card-icon { font-size: 2.2rem; display: block; margin-bottom: 5px; }
    .card-btn span { font-size: 0.85rem; font-weight: 600; color: #d63384; }

    /* Views */
    .letter-box {
      text-align: left;
      background: #fff;
      padding: 18px;
      border-radius: 12px;
      max-height: 260px;
      overflow-y: auto;
      font-size: 0.92rem;
      line-height: 1.6;
      border: 1px dashed #ffb6c1;
      color: #333;
    }
    .flower-box {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #ffb6c1;
      font-size: 3.5rem;
      display: flex;
      justify-content: space-around;
    }
    .music-card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #ffb6c1;
    }
    .music-card audio { width: 100%; margin-top: 10px; }

    .back-btn {
      margin-top: 15px;
      background: #d63384;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
    }

    /* Floating Background Elements */
    .floating {
      position: absolute;
      pointer-events: none;
      animation: float 6s ease-in-out infinite;
      z-index: 1;
      font-size: 1.5rem;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }
  </style>
</head>
<body>
